services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GWENGIFT_ENVIRONMENT: ${GWENGIFT_ENVIRONMENT:-production}
      GWENGIFT_DATABASE_URL: sqlite:////data/gwengift.db
      GWENGIFT_TELEGRAM_BOT_TOKEN: ${GWENGIFT_TELEGRAM_BOT_TOKEN:-}
      GWENGIFT_DEV_IDENTITY_ENABLED: ${GWENGIFT_DEV_IDENTITY_ENABLED:-false}
      GWENGIFT_TRACING_ENABLED: ${GWENGIFT_TRACING_ENABLED:-false}
      GWENGIFT_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${GWENGIFT_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      GWENGIFT_TRACING_SERVICE_NAMESPACE: ${GWENGIFT_TRACING_SERVICE_NAMESPACE:-gwengift}
    volumes:
      - gwengift-production-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  gwengift-production-data:
